# Monorepo API deploy. If Railway "Root Directory" is `server`, set
# Settings → Config-as-code → path to `server/railway.toml` (or rely on migrate-on-start in code).

[build]
builder = "RAILPACK"
buildCommand = "npm install --prefix server && npm run build --prefix server && cd server && npx prisma generate"

[deploy]
startCommand = "npm run start --prefix server"
